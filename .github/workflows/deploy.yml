name: Deploy instaContentGenerator to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Abhängigkeiten installieren
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Next.js Anwendung bauen
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build-Cache vor Transfer entfernen
        run: rm -rf .next/cache

      - name: Zielverzeichnis auf Server vorbereiten
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: mkdir -p /home/instaContentGenerator

      - name: Kopiere Dateien auf den Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: ".next,public,package.json,package-lock.json,next.config.mjs,ecosystem.config.cjs,process-manager.json"
          target: "/home/instaContentGenerator"

      - name: Führe Befehle auf Server aus (Deploy & Start)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # NVM und globale Pfade laden, da ssh-action eine non-interactive Shell nutzt
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.npm-global/bin:$PATH"

            cd /home/instaContentGenerator
            mkdir -p data/posts data/image-sets
            npm install --omit=dev
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save
